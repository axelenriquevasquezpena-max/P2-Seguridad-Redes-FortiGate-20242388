server {
    listen 80;
    server_name 10.23.88.130 web-p2.test;

    root /var/www/p2;
    index index.php;

    access_log /var/log/nginx/p2-http-access.log;
    error_log /var/log/nginx/p2-http-error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ /\. {
        deny all;
    }
}
